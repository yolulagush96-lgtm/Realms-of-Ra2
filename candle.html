<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm of ra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="constellations">
         <div class="star star-1"></div>
         <div class="star star-2"></div>
         <div class="star star-3"></div>

         <div class="line line-1"></div>
         <div class="line line-2"></div>
    </div>

    <div class="constellation-map">

    <!-- ORION -->
    <div class="constellation orion">
        <span class="star o1"></span>
        <span class="star o2"></span>
        <span class="star o3"></span>
        <span class="star o4"></span>
        <span class="star o5"></span>
        <span class="star o6"></span>
        <span class="star o7"></span>

        <i class="line ol1"></i>
        <i class="line ol2"></i>
        <i class="line ol3"></i>
        <i class="line ol4"></i>
        <i class="line ol5"></i>
        <i class="line ol6"></i>
    </div>

    <!-- SCORPIUS -->
    <div class="constellation scorpius">
        <span class="star s1"></span>
        <span class="star s2"></span>
        <span class="star s3"></span>
        <span class="star s4"></span>
        <span class="star s5"></span>
        <span class="star s6"></span>
        <span class="star s7"></span>
        <span class="star s8"></span>

        <i class="line sl1"></i>
        <i class="line sl2"></i>
        <i class="line sl3"></i>
        <i class="line sl4"></i>
        <i class="line sl5"></i>
        <i class="line sl6"></i>
        <i class="line sl7"></i>
    </div>

    <!-- LEO -->
    <div class="constellation leo">
        <span class="star l1"></span>
        <span class="star l2"></span>
        <span class="star l3"></span>
        <span class="star l4"></span>
        <span class="star l5"></span>
        <span class="star l6"></span>
        <span class="star l7"></span>

        <i class="line ll1"></i>
        <i class="line ll2"></i>
        <i class="line ll3"></i>
        <i class="line ll4"></i>
        <i class="line ll5"></i>
        <i class="line ll6"></i>
    </div>

</div>
    <div class="stars"></div>
</body>
</html>
